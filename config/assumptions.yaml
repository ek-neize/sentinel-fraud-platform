# ---------------------------------------------------------------------------
# Sentinel business assumptions — the ONLY place cost / capacity numbers live.
# Every dollar figure in reports and dashboards must trace back to this file.
# Numbers are illustrative; change them and re-run evaluation to see impact.
# ---------------------------------------------------------------------------

capacity:
  # Investigator team can review this many alerts per calendar day.
  alerts_per_day: 100
  # Tighter scenario reported alongside the main one.
  alerts_per_day_tight: 25

costs:
  # Fully loaded analyst cost to review one alert (salary + tooling), USD.
  investigation_cost_per_alert: 25.0
  # Extra cost when a review escalates to a full case (customer contact, etc.).
  escalation_cost_per_case: 75.0
  # Share of a missed fraud's amount the institution ultimately loses
  # (after chargebacks / merchant liability). 1.0 = full loss.
  missed_fraud_loss_rate: 0.85
  # Fixed overhead per missed fraud (chargeback handling, card reissue).
  missed_fraud_fixed_cost: 15.0
  # Customer-friction cost of a false positive that leads to a card block.
  false_positive_friction_cost: 5.0

detection:
  # Share of a caught fraud's amount that is actually prevented/recovered.
  caught_fraud_recovery_rate: 0.90

alerting:
  # Alerts not reviewed on their first day wait in a backlog; reviewers always take the
  # highest-priority open alerts. After this many days an unreviewed alert expires
  # (by then the card is usually hot-listed or the burst is over).
  max_age_days: 3
  # Review order: "score" (fraud probability) or "expected_loss" (probability x amount).
  priority: score
  # Daily digest: how many top alerts to show.
  digest_top_n: 20

evaluation:
  # Daily review budgets swept for the capacity curve (alerts per day).
  capacities: [5, 10, 15, 20, 25, 30, 40, 50, 75, 100]
  # Day-level bootstrap for confidence intervals.
  bootstrap_iterations: 1000
  ci_level: 0.95
  # Age bands for the fairness check (lower bounds, years).
  age_bands: [0, 30, 45, 60]

labels:
  # Fraud labels are not known at transaction time. Two channels deliver them:
  channels:
    customer_report:          # cardholder notices (SMS alert / statement) and calls in
      share: 0.6
      lag_hours_min: 2
      lag_hours_max: 72
    chargeback:               # formal dispute, much slower
      share: 0.4
      lag_days_min: 15
      lag_days_max: 60

watchlist:
  # --- Card hot-list: operations lists a card soon after its first fraud label.
  card_listing_rate: 0.9      # share of reported cards actually hot-listed
  card_listing_lag_hours_min: 1
  card_listing_lag_hours_max: 12
  card_ttl_days: 14           # card monitored for two weeks, then reissued/cleared
  # --- Merchant risk list: re-evaluated on a schedule from labels known so far.
  merchant_review_every_days: 30
  merchant_window_days: 90    # trailing window for the merchant fraud rate
  merchant_min_txns: 200      # ignore merchants with too little volume
  merchant_rate_multiplier: 5.0   # list if rate >= multiplier x global known rate
  merchant_listing_lag_days_min: 1
  merchant_listing_lag_days_max: 5
  merchant_ttl_days: 60
  # --- Noise: clean entities listed by mistake (e.g. unverified external lists).
  noise_cards: 10
  noise_merchants: 5
  noise_ttl_days: 30

split:
  # Chronological split. Gap month absorbs label lag & boundary leakage.
  train_start: "2019-01-01"
  train_end: "2020-03-01"     # exclusive
  gap_end: "2020-04-01"       # exclusive; Mar 2020 unused
  valid_end: "2020-07-01"     # exclusive
  test_end: "2021-01-01"      # exclusive

random_seed: 42

assistant:
  # Investigation assistant (Step 9). Providers: template (offline baseline, no key),
  # anthropic (needs ANTHROPIC_API_KEY), databricks (a Model Serving chat endpoint).
  anthropic_model: claude-sonnet-5-5
  anthropic_effort: medium
  judge_model: claude-opus-5-5     # a different model grades the drafts
  databricks_endpoint: databricks-meta-llama-3-3-70b-instruct
  max_tokens: 8000
  retrieve_k: 10                   # SOP sections retrieved per case, plus the pinned ones
  pinned_sections: ["SOP-002 §1", "SOP-009 §1", "SOP-010 §1"]
  history_days: 7
  # USD per million tokens (input, output), for the cost line in the evaluation report.
  prices:
    claude-sonnet-5-5: [2.0, 10.0]
    claude-opus-5-5: [4.0, 20.0]
    claude-haiku-5-5: [0.10, 0.50]

monitoring:
  # Daily checks (notebook 09). Status = worst of ok / warn / critical.
  window_days: 7                 # checks look at the last 7 days up to the run date
  drift_warn: 0.10               # PSI vs the validation period
  drift_critical: 0.25
  drift_exempt: [card_prior_txn_count]   # grows by design (a card's history only grows)
  alert_volume_warn: [0.5, 1.5]          # new alerts/day as a multiple of the review budget
  alert_volume_critical: [0.25, 3.0]
  backlog_warn_days: 1.0         # open alerts at day end, in days of review capacity
  backlog_critical_days: 2.0
  expired_warn: 0.05             # share of the window's alerts that expired unreviewed
  expired_critical: 0.15
  precision_warn: 0.50           # share of reviewed alerts confirmed as fraud
  precision_critical: 0.30
  matured_after_days: 60         # chargebacks arrive within 60 days; older cohorts are final
  recall_warn: 0.80              # recall above threshold on the latest matured 30-day cohort
  recall_critical: 0.70
  null_increase_warn: 0.02       # rise in a feature's missing share vs the reference period
  null_increase_critical: 0.10
  label_bands: [0, 7, 30, 60]    # transaction-age bands (days) for the label-maturity view

promotion:
  # A newly trained model replaces @champion only if, on the validation period, it is
  # at least as good on the primary metric and does not lose recall at the review budget.
  primary_metric: pr_auc
  min_primary_gain: 0.0          # >= 0: ties go to the incumbent only if below this gain
  guard_metric: topk25_recall    # recall when reviewing the top 25 alerts/day
  max_guard_drop: 0.01           # allowed drop in the guard metric (absolute)
