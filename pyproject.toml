[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel: capacity-aware fraud detection & investigation platform"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "pyyaml>=6",
    "pydantic>=2.5",
    "tabulate>=0.9",
]

[project.optional-dependencies]
kaggle = ["kaggle>=1.6"]
stream = ["confluent-kafka>=2.4", "python-dotenv>=1.0"]
spark = ["pyspark>=3.5"]  # local tests of notebook transforms (needs Java 17+)
ml = ["scikit-learn>=1.4", "xgboost>=2.0", "mlflow-skinny>=2.14", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: spark/dbutils/display are injected globals; MAGIC lines are long.
"notebooks/databricks/*.py" = ["F821", "E501", "I001", "E402"]
"tests/test_bronze_transforms.py" = ["E402"]
