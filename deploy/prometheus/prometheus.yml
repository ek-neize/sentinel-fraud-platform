# Prometheus for the Compose demo stack (docker compose up).
global:
  scrape_interval: 5s          # short for the demo; 15-30s is typical in production
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: sentinel-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
